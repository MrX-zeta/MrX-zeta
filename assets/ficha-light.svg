<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d">
  <title id="t">Brian Ruiz · Desarrollador de software</title>
  <desc id="d">Tarjeta de presentación de Brian Ruiz, desarrollador de software en Chiapas, México. Software a la medida: aplicaciones móviles y web, APIs y bases de datos, automatización de procesos. Abierto a proyectos y vacantes.</desc>
  <defs><clipPath id="card"><rect width="880" height="320" rx="14"/></clipPath></defs>
  <style>
  .t{font-family:Georgia, 'Times New Roman', 'Noto Serif', serif;}
  .name{font-size:58px;fill:#121826;letter-spacing:-1.2px}
  .role{font-size:18px;fill:#5b6578;letter-spacing:.3px}
  .h{font-size:17px;fill:#121826;font-weight:bold}
  .li{font-size:16px;fill:#3c4658}
  .foot{font-size:12.5px;fill:#5b6578;letter-spacing:.2px}
  .acc{stroke:#4a5fd0;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .edge{stroke:#4a5fd0;stroke-width:1.4;fill:none;opacity:.6;stroke-dasharray:1;stroke-dashoffset:0;animation:draw var(--u) ease-out var(--d) both}
  .core{transform-box:fill-box;transform-origin:center;animation:pop .3s ease-out var(--d) both}
  .halo{opacity:.75;animation:glow .9s ease-out var(--g) both}
  .phone{opacity:0;animation:vanish 3.2s ease-in-out both}
  .body{fill:#f5f6fa;stroke:#3c4658;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .8s ease-out both}
  .ui{fill:none;stroke:#3c4658;stroke-width:1.2}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
  @keyframes glow{0%{opacity:0}45%{opacity:1}100%{opacity:.75}}
  @keyframes vanish{0%{opacity:0}14%{opacity:1}38%{opacity:1}60%{opacity:0}100%{opacity:0}}

  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
